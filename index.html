<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考研英语真题词汇库</title><style>
:root {
  color-scheme: light;
  --ink: #15243b;
  --muted: #53647c;
  --line: #dbe3ed;
  --accent: #244b83;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: auto;
  max-width: 1064px;
  padding: clamp(16px, 4vw, 48px) clamp(16px, 4vw, 40px);
  background: #eff3f8;
  color: var(--ink);
  line-height: 1.6;
}
header {
  padding: clamp(24px, 5vw, 56px);
  border-radius: 24px;
  background: linear-gradient(125deg, #111e33, #20395b);
  color: #f7faff;
  margin-bottom: 20px;
}
h1 { margin: 0 0 24px; font-size: clamp(26px, 5vw, 46px); line-height: 1.2; letter-spacing: -.035em; }
#stats { color: #d9e5f5; font-size: 14px; font-variant-numeric: tabular-nums; }
progress { display: block; width: min(100%, 320px); height: 6px; margin-top: 10px; accent-color: #8bb8ff; border: 0; border-radius: 6px; overflow: hidden; background: #49617f; }
progress::-webkit-progress-bar { background: #49617f; }
progress::-webkit-progress-value { background: #8bb8ff; }
progress::-moz-progress-bar { background: #8bb8ff; }
.toolbar { background: #fff; padding: clamp(12px, 2.5vw, 20px); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 18px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
input, select, button { font: inherit; border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 7px 12px; background: #fff; color: var(--ink); }
#q { width: 100%; background: #f4f7fb; }
#q::placeholder { color: var(--muted); }
button { cursor: pointer; }
button:hover { background: #eaf1fa; }
:focus-visible { outline: 3px solid #658dcc; outline-offset: 2px; }
#quiz { background: var(--accent); border-color: var(--accent); color: #fff; }
#quiz:hover { background: #193c6d; }
#list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 14px; }
article { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: clamp(16px, 3vw, 24px); min-width: 0; }
article button { margin: 8px 8px 0 0; color: var(--accent); }
h2 { margin: 9px 0 8px; font-size: clamp(23px, 3vw, 30px); line-height: 1.2; letter-spacing: -.025em; overflow-wrap: anywhere; }
.tag { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.meaning { font-weight: 650; margin: 10px 0 6px; }
.example { color: var(--muted); margin: 6px 0; overflow-wrap: anywhere; }
.note { font-size: 14px; color: #344965; background: #edf3fa; border-radius: 9px; padding: 9px 12px; margin: 12px 0 4px; }
.master { background: #e3eefc; border-color: #c4d6ef; }
footer { font-size: 13px; color: var(--muted); margin-top: 24px; }
@media (max-width: 640px) {
  #list { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .controls > :is(button, select) { min-width: 0; font-size: 13px; padding-inline: 5px; }
  #q { font-size: 16px; }
}
</style><header><h1>考研英语真题词汇库</h1><div id="stats"></div><progress id="bar" aria-label="词汇掌握进度"></progress></header><section class="toolbar" aria-label="搜索和练习"><input id="q" aria-label="搜索词条" placeholder="搜索单词、中文、题号"><div class="controls"><select id="year" aria-label="按年份筛选"><option value="">全部年份</option><option>2016</option><option>2022</option></select><select id="cat" aria-label="按类别筛选"><option value="">全部类别</option><option>熟词僻义</option><option>固定搭配</option><option>核心词汇</option></select><select id="status" aria-label="按掌握状态筛选"><option value="">全部状态</option><option value="0">未掌握</option><option value="1">已掌握</option></select><button id="quiz">隐藏释义</button><button id="export">备份进度</button><button id="import">恢复进度</button><input type="file" id="file" accept="application/json" hidden></div></section><main id="list"></main><footer>来源：2016、2022年英语一翻译真题（46—50题）。释义与易错提示为学习整理。进度保存在当前浏览器，更新文件前建议备份。</footer><script>const data=[{"y": 2016, "n": 46, "c": "固定搭配", "w": "be built into", "m": "内在于；与生俱来", "e": "it is built into us", "b": "不要译为被建立"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "in the same way that", "m": "正如……一样", "e": "in the same way that our bodies know", "b": "注意比较关系"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "heal a cut", "m": "治愈伤口", "e": "heal a cut", "b": "heal 指愈合、治愈"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "mend a broken bone", "m": "修复断骨", "e": "mend a broken bone", "b": "broken bone 是断骨"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "go anywhere", "m": "去任何地方；否定语境中可指消失", "e": "doesn't really go anywhere", "b": "结合上下文译为并未消失"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "hidden from view", "m": "从视线中隐去", "e": "temporarily hidden from view", "b": "from 表示离开视线"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "be capable of doing", "m": "能够做某事", "e": "fully capable of being restored", "b": "of 后接动名词"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "in an instant", "m": "瞬间", "e": "restored in an instant", "b": "注意时间信息"}, {"y": 2016, "n": 48, "c": "核心词汇", "w": "sympathy", "m": "n. 同情",  "c": "固定搭配", "w": "struggle for", "m": "为争取……而斗争", "e": "the struggle for Spain", "b": "争夺西班牙的战争"}, {"y": 2022, "n": 50, "c": "固定搭配", "w": "attempt to do", "m": "做某事的尝试或努力", "e": "his attempts to make his way up", "b": "attempts 是名词主语"}, {"y": 2022, "n": 50, "c": "固定搭配", "w": "make one's way up", "m": "逐步向上发展", "e": "make his way up the promotion ladder", "b": "谋求晋升"}, {"y": 2022, "n": 50, "c": "固定搭配", "w": "promotion ladder", "m": "晋升阶梯", "e": "the promotion ladder", "b": "结合语境译为职位晋升"}, {"y": 2022, "n": 50, "c": "固定搭配", "w": "speak volumes about", "m": "充分说明；深刻揭示", "e": "speak volumes about British society", "b": "不是大声说话"}];let saved={};try{saved=JSON.parse(localStorage.getItem('eng-vocab-v1')||'{}')}catch(e){}let hide=false;const $=id=>document.getElementById(id);const key=r=>r.y+'-'+r.n+'-'+r.w;function save(){try{localStorage.setItem('eng-vocab-v1',JSON.stringify(saved))}catch(e){alert('浏览器无法保存进度，请使用备份功能')}}function render(){let count=data.filter(r=>saved[key(r)]).length;$('stats').textContent=`共 ${data.length} 条 · 已掌握 ${count} 条`;$('bar').max=data.length;$('bar').value=count;let q=$('q').value.toLowerCase();$('list').replaceChildren();for(const r of data){let k=key(r);if($('year').value&&r.y!= $('year').value||$('cat').value&&r.c!=$('cat').value||$('status').value&&Number(!!saved[k])!=Number($('status').value)||!Object.values(r).join(' ').toLowerCase().includes(q))continue;let a=document.createElement('article');let tag=document.createElement('div');tag.className='tag';tag.textContent=`${r.y} · 第${r.n}题 · ${r.c}`;a.append(tag);let h=document.createElement('h2');h.textContent=r.w;a.append(h);let detail=document.createElement('div');for(const [cls,t] of [['meaning',r.m],['example','真题：'+r.e],['note','提示：'+r.b]]){let p=document.createElement('p');p.className=cls;p.textContent=t;detail.append(p)}detail.hidden=hide;a.append(detail);let reveal=document.createElement('button');reveal.textContent='查看释义';reveal.hidden=!hide;reveal.onclick=()=>{detail.hidden=!detail.hid
