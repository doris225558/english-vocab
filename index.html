<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考研英语真题词汇库</title><style>*{box-sizing:border-box}body{margin:auto;max-width:850px;padding:24px 16px;font:16px/1.65 -apple-system,BlinkMacSystemFont,sans-serif;background:#f5f5f0;color:#24352f}h1{font-size:27px;margin:8px 0}small{color:#64746b}header{margin-bottom:20px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}input,select,button{font:inherit;border:1px solid #c8d1c8;border-radius:9px;padding:9px;background:white;color:inherit}input{width:100%}button{cursor:pointer}article{background:white;border:1px solid #e0e5df;border-radius:14px;padding:16px;margin:10px 0}h2{font-size:20px;margin:4px 0;overflow-wrap:anywhere}.tag{font-size:12px;color:#64746b}.meaning{font-weight:600}.example{color:#52645b;overflow-wrap:anywhere}.note{font-size:14px;background:#f5f1e6;padding:8px;border-radius:6px}.master{background:#e5f0e7}progress{width:100%;accent-color:#47765b}footer{font-size:13px;color:#64746b}</style><header><small>ENGLISH I · 真题积累 / V1</small><h1>考研英语真题词汇库</h1><div id="stats"></div><progress id="bar"></progress></header><input id="q" placeholder="搜索单词、中文、题号"><div class="controls"><select id="year"><option value="">全部年份</option><option>2016</option><option>2022</option></select><select id="cat"><option value="">全部类别</option><option>熟词僻义</option><option>固定搭配</option><option>核心词汇</option></select><select id="status"><option value="">全部状态</option><option value="0">未掌握</option><option value="1">已掌握</option></select><button id="quiz">隐藏释义</button><button id="export">备份进度</button><button id="import">恢复进度</button><input type="file" id="file" accept="application/json" hidden></div><main id="list"></main><footer>来源：2016、2022年英语一翻译真题（46—50题）。释义与易错提示为学习整理。进度保存在当前浏览器，更新文件前建议备份。</footer><script>const data=[{"y": 2016, "n": 46, "c": "固定搭配", "w": "be built into", "m": "内在于；与生俱来", "e": "it is built into us", "b": "不要译为被建立"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "in the same way that", "m": "正如……一样", "e": "in the same way that our bodies know", "b": "注意比较关系"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "heal a cut", "m": "治愈伤口", "e": "heal a cut", "b": "heal 指愈合、治愈"}, {"y": 2016, "n": 46, "c": "固定搭配", "w": "mend a broken bone", "m": "修复断骨", "e": "mend a broken bone", "b": "broken bone 是断骨"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "go anywhere", "m": "去任何地方；否定语境中可指消失", "e": "doesn't really go anywhere", "b": "结合上下文译为并未消失"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "hidden from view", "m": "从视线中隐去", "e": "temporarily hidden from view", "b": "from 表示离开视线"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "be capable of doing", "m": "能够做某事", "e": "fully capable of being restored", "b": "of 后接动名词"}, {"y": 2016, "n": 47, "c": "固定搭配", "w": "in an instant", "m": "瞬间", "e": "restored in an instant", "b": "注意时间信息"}, {"y": 2016, "n": 48, "c": "核心词汇", "w": "sympathy", "m": "n. 同情", "e": "with sympathy", "b": "怀着同情"}, {"y": 2016, "n": 48, "c": "核心词汇", "w": "kindness", "m": "n. 善意；友善", "e": "with kindness", "b": "结合语境译为善意"}, {"y": 2016, "n": 48, "c": "核心词汇", "w": "unconditional", "m": "adj. 无条件的", "e": "unconditional love", "b": "无条件的爱"}, {"y": 2016, "n": 48, "c": "核心词汇", "w": "no matter who", "m": "无论谁", "e": "no matter who they are", "b": "让步关系"}, {"y": 2016, "n": 49, "c": "熟词僻义", "w": "cure-all", "m": "n. 万能良药", "e": "the cure-all for living our lives", "b": "灵丹妙药也可"}, {"y": 2016, "n": 49, "c": "熟词僻义", "w": "perfectly ordinary", "m": "再寻常不过", "e": "it is perfectly ordinary", "b": "perfectly 修饰 ordinary，不是完美的原则"}, {"y": 2016, "n": 49, "c": "熟词僻义", "w": "direct sb. through sth.", "m": "引导某人度过某事", "e": "direct you through all your difficult decisions", "b": "through 不宜机械译为通过"}, {"y": 2016, "n": 49, "c": "熟词僻义", "w": "difficult decision", "m": "艰难的抉择", "e": "all your difficult decisions", "b": "不是错误的选择"}, {"y": 2016, "n": 50, "c": "固定搭配", "w": "come to see", "m": "逐渐明白；最终认识到", "e": "as you will come to see", "b": "see 可指理解"}, {"y": 20 length;$('bar').value=count;let q=$('q').value.toLowerCase();$('list').replaceChildren();for(const r of data){let k=key(r);if($('year').value&&r.y!= $('year').value||$('cat').value&&r.c!=$('cat').value||$('status').value&&Number(!!saved[k])!=Number($('status').value)||!Object.values(r).join(' ').toLowerCase().includes(q))continue;let a=document.createElement('article');let tag=document.createElement('div');tag.className='tag';tag.textContent=`${r.y} · 第${r.n}题 · ${r.c}`;a.append(tag);let h=document.createElement('h2');h.textContent=r.w;a.append(h);let detail=document.createElement('div');for(const [cls,t] of [['meaning',r.m],['example','真题：'+r.e],['note','提示：'+r.b]]){let p=document.createElement('p');p.className=cls;p.textContent=t;detail.append(p)}detail.hidden=hide;a.append(detail);let reveal=document.createElement('button');reveal.textContent='查看释义';reveal.hidden=!hide;reveal.onclick=()=>{detail.hidden=!detail.hidden;reveal.textContent=detail.hidden?'查看释义':'收起释义'};a.append(reveal);let b=document.createElement('button');b.textContent=saved[k]?'✓ 已掌握':'标记掌握';b.className=saved[k]?'master':'';b.onclick=()=>{saved[k]=!saved[k];save();render()};a.append(b);$('list').append(a)}if(!$('list').children.length)$('list').textContent='没有符合条件的词条。'}for(const id of ['q','year','cat','status'])$(id).addEventListener('input',render);$('quiz').onclick=()=>{hide=!hide;$('quiz').textContent=hide?'显示释义':'隐藏释义';render()};$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved)],{type:'application/json'}));a.download='vocab-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{let v=JSON.parse(await $('file').files[0].text());if(!v||Array.isArray(v)||typeof v!=='object')throw Error();for(const k of Object.keys(v))if(typeof v[k]==='boolean')saved[k]=v[k];save();render()}catch(e){alert('备份文件无效')}};render();</script></html>
